# fly.toml — Fly.io deployment config for gemstone-intake
#
# Deploy:
#   fly launch  (first time only — rename the app, pick a region)
#   fly deploy
#
# Set the API key (optional but recommended for anything beyond local use):
#   fly secrets set INTAKE_API_KEY="<a-long-random-string>"
#
# Region: sin (Singapore).
# Scale: exactly ONE machine (jobs are kept in memory; run `fly scale count 1`).

app = "gemstone-intake"
primary_region = "sin"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
